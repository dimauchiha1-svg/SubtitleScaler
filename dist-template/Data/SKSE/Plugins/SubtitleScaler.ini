; SubtitleScaler.ini
; Place next to SubtitleScaler.dll (Data/SKSE/Plugins).
; Comment lines start with ; or #.
;
; Each [Section] describes one text element to enlarge.
; Parameters shared by all sections:
;   Enabled  - 1 = on, 0 = off
;   Scale    - size in percent: 100 = original, 150 = one and a half times bigger. Range 50-400
;   OffsetX, OffsetY - shift in Flash stage units (roughly pixels of a 1280x720 interface).
;              An enlarged element may grow downwards or sideways. Use the offset to move it
;              back into place: a negative OffsetY moves the element up
;   MaxWidth - maximum visible width of the element (the Skyrim stage is 1280 wide). If the enlarged
;              text is wider, long lines are wrapped onto new lines instead of running off the
;              screen. 0 = no limit. Default is 1100 for subtitles
;   Color    - text color as RRGGBB (for example FFFF00 = yellow, FFFFFF = white). Leave empty to keep the
;              original color. Works for [HUD] and [Dialogue]; the list of response options is not supported
;   Anchor   - left or center. When enlarged, the element either grows to the right from its left
;              edge (left) or stays centered in place (center). Default for the dialogue window
;              is center
;   Menu     - internal name of the menu that contains the element
;   Paths    - path to the element inside the menu. Several paths can be separated with |,
;              the first one found is used
;
; Change Menu and Paths only if you use a non-standard interface.

; ---------------------------------------------------------------------------
; NPC subtitles
; ---------------------------------------------------------------------------

; An NPC talking to another NPC, or an NPC addressing the player without opening
; the dialogue window (greetings, guard warnings, etc.)
[HUD]
Enabled=1
Scale=150
OffsetX=0
OffsetY=0
MaxWidth=1100
Color=
Menu=HUD Menu
Paths=_root.HUDMovieBaseInstance.SubtitleTextHolder

; An NPC line inside the dialogue window with the player
[Dialogue]
Enabled=1
Scale=150
OffsetX=0
OffsetY=0
MaxWidth=1100
Color=
Menu=Dialogue Menu
Paths=_root.DialogueMenu_mc.SubtitleText

; ---------------------------------------------------------------------------
; Speaker names (disabled by default)
; They have their own scale and color, separate from the subtitle text.
; [DialogueName] is a separate element of the dialogue window, so it also supports OffsetX / OffsetY.
; [HUDName] is part of the subtitle text in the world (drawn as a separate font span), so only Scale
; and Color work for it: the position cannot be changed separately (use [HUD] for that). Menu and Paths
; are not used for [HUDName].
; ---------------------------------------------------------------------------

[HUDName]
Enabled=0
Scale=100
Color=

[DialogueName]
Enabled=0
Scale=100
OffsetX=0
OffsetY=0
Color=
Menu=Dialogue Menu
Paths=_root.DialogueMenu_mc.SpeakerName|_root.DialogueMenu_mc.SpeakerNameText

; ---------------------------------------------------------------------------
; Player response options (disabled by default)
; ---------------------------------------------------------------------------

[PlayerChoices]
Enabled=0
Scale=130
OffsetX=0
OffsetY=0
Menu=Dialogue Menu
Paths=_root.DialogueMenu_mc.TopicListHolder
