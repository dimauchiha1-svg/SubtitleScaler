; SubtitleScaler.ini
; Положите рядом с SubtitleScaler.dll (Data/SKSE/Plugins).
; Комментарии начинаются с ; или # в начале строки.
;
; Каждая секция [Имя] описывает один текстовый элемент, который нужно увеличить.
; Общие параметры секции:
;   Enabled  - 1 включено, 0 выключено
;   Scale    - масштаб в процентах: 100 = как в оригинале, 150 = в полтора раза крупнее. От 50 до 400
;   OffsetX, OffsetY - сдвиг в единицах Flash-сцены (примерно пиксели интерфейса 1280x720).
;              При увеличении элемент может «расти» вниз или вбок. Подберите сдвиг,
;              чтобы вернуть его на место: отрицательный OffsetY поднимает элемент вверх
;   Menu     - внутреннее имя меню, в котором лежит элемент
;   Paths    - путь к элементу внутри меню. Можно перечислить несколько через |,
;              плагин возьмёт первый найденный
;
; Menu и Paths менять нужно только при нестандартном интерфейсе.

; ---------------------------------------------------------------------------
; Субтитры реплик NPC
; ---------------------------------------------------------------------------

; NPC говорит с другим NPC, а также NPC обращается к игроку без окна диалога
; (приветствия, окрики стражи и т.п.)
[HUD]
Enabled=1
Scale=150
OffsetX=0
OffsetY=0
Menu=HUD Menu
Paths=_root.HUDMovieBaseInstance.SubtitleTextHolder

; Реплика NPC в окне диалога с игроком
[Dialogue]
Enabled=1
Scale=150
OffsetX=0
OffsetY=0
Menu=Dialogue Menu
Paths=_root.DialogueMenu_mc.SubtitleText

; ---------------------------------------------------------------------------
; Варианты ответа игрока (по умолчанию выключено)
; ---------------------------------------------------------------------------

[PlayerChoices]
Enabled=0
Scale=130
OffsetX=0
OffsetY=0
Menu=Dialogue Menu
Paths=_root.DialogueMenu_mc.TopicListHolder
